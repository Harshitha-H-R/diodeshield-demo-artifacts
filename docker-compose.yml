services:
  diodeshield-soc:
    build: .
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8000:8000"
    environment:
      - DIODESHIELD_DB=/app/data/diodeshield.db
      - DIODESHIELD_INTERFACE=auto
      - DIODESHIELD_LIVE_CAPTURE=true
      - DIODESHIELD_ENV=production
    volumes:
      - diodeshield-data:/app/data
    restart: unless-stopped

volumes:
  diodeshield-data:
